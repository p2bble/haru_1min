name: haru_1min
description: "하루 1분 - 물과 영양제를 간편하게 관리하세요"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1

  # 로컬 DB
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # 이미지
  image_picker: ^1.1.2

  # 알림
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # 유틸
  intl: ^0.19.0
  shared_preferences: ^2.3.4

  # UI
  percent_indicator: ^4.2.3

  # 홈 화면 위젯
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "store_assets/icon_512.png"
  adaptive_icon_background: "#4FC3F7"
  adaptive_icon_foreground: "store_assets/icon_512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
